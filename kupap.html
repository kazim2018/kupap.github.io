<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Довідник КУпАП — Патрульна поліція</title>
    <!-- Tailwind CSS CDN для сучасного стильного інтерфейсу -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        police: {
                            50: '#f0f4f9',
                            100: '#d9e2ec',
                            500: '#1b3a6b',
                            700: '#0f2444',
                            800: '#0a1931',
                            900: '#060d1a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .badge { @apply text-xs font-semibold px-2 py-0.5 rounded-full; }
        .tab-active { @apply border-b-2 border-blue-600 text-blue-600 font-bold dark:border-blue-400 dark:text-blue-400; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Верхня панель навігації -->
    <header class="bg-police-800 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-shield-halved text-yellow-400 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg md:text-xl leading-tight">Е-Довідник КУпАП</h1>
                    <p class="text-xs text-blue-200">Швидка кваліфікація та процесуальні строки</p>
                </div>
            </div>
            <button id="themeToggle" class="p-2 rounded-lg bg-police-700 hover:bg-police-500 transition text-yellow-300">
                <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Основний контент -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-5">
        
        <!-- Вкладки розділів -->
        <div class="flex border-b border-gray-300 dark:border-gray-700 mb-5">
            <button id="tabOffensesBtn" onclick="switchTab('offenses')" class="py-2.5 px-4 text-sm md:text-base font-medium flex items-center gap-2 tab-active transition">
                <i class="fa-solid fa-scale-balanced"></i> Правопорушення (Особлива ч.)
            </button>
            <button id="tabGeneralBtn" onclick="switchTab('general')" class="py-2.5 px-4 text-sm md:text-base font-medium flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 transition">
                <i class="fa-solid fa-book-open"></i> Загальна частина та Процес
            </button>
        </div>

        <!-- ================= РОЗДІЛ 1: ОСОБЛИВА ЧАСТИНА ================= -->
        <div id="sectionOffenses">
            <!-- Пошук та фільтри -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow mb-5 space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="offenseSearch" onkeyup="filterOffenses()" placeholder="Пошук статті (напр., 173, наркотики, хуліганство, суд, штраф)..." 
                           class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex flex-wrap gap-2 text-xs md:text-sm">
                    <button onclick="setFilter('all')" class="filter-btn px-3 py-1.5 rounded-md bg-blue-600 text-white font-medium">Всі</button>
                    <button onclick="setFilter('detention')" class="filter-btn px-3 py-1.5 rounded-md bg-gray-200 dark:bg-gray-700 hover:bg-gray-300">Затримання (ст. 262)</button>
                    <button onclick="setFilter('court')" class="filter-btn px-3 py-1.5 rounded-md bg-gray-200 dark:bg-gray-700 hover:bg-gray-300">Суд</button>
                    <button onclick="setFilter('commission')" class="filter-btn px-3 py-1.5 rounded-md bg-gray-200 dark:bg-gray-700 hover:bg-gray-300">Адмінкомісія</button>
                    <button onclick="setFilter('presence')" class="filter-btn px-3 py-1.5 rounded-md bg-gray-200 dark:bg-gray-700 hover:bg-gray-300">Обов'язкова присутність (ст. 268)</button>
                </div>
            </div>

            <!-- Лічильник результатів -->
            <div class="mb-3 text-xs text-gray-500 dark:text-gray-400 flex justify-between items-center">
                <span>Знайдено статей: <strong id="offenseCount" class="text-blue-600 dark:text-blue-400">0</strong></span>
                <span class="text-[11px] italic">* Зелений щит: можливе адмінзатримання</span>
            </div>

            <!-- Список карток правопорушень -->
            <div id="offensesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Картки генеруються за допомогою JS -->
            </div>
        </div>

        <!-- ================= РОЗДІЛ 2: ЗАГАЛЬНА ТА ПРОЦЕСУАЛЬНА ЧАСТИНА ================= -->
        <div id="sectionGeneral" class="hidden">
            <!-- Пошук у загальних статтях -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow mb-5">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" id="generalSearch" onkeyup="filterGeneral()" placeholder="Пошук процесуальної статті (напр., 38 строки, 260 заходи, 263 затримання)..." 
                           class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Список карток процесу -->
            <div id="generalGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Картки генеруються через JS -->
            </div>
        </div>

    </main>

    <footer class="bg-police-900 text-gray-400 text-xs py-4 text-center border-t border-gray-800">
        <p>Шпаргалка патрульного поліцейського України • Згенеровано згідно з матеріалами КУпАП</p>
    </footer>

        // Фільтрація карток Особливої частини
        function filterOffenses() {
            const query = document.getElementById('offenseSearch').value.toLowerCase();

            const filtered = offensesData.filter(item => {
                const matchesQuery = item.article.toLowerCase().includes(query) ||
                                     item.fabula.toLowerCase().includes(query) ||
                                     item.sanction.toLowerCase().includes(query) ||
                                     item.judge.toLowerCase().includes(query);

                if (!matchesQuery) return false;

                if (currentFilter === 'detention') return item.detention;
                if (currentFilter === 'court') return item.judge.toLowerCase().includes('суд');
                if (currentFilter === 'commission') return item.judge.toLowerCase().includes('адмінкомісія');
                if (currentFilter === 'presence') return item.presence;

                return true;
            });

            renderOffenses(filtered);
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-3 py-1.5 rounded-md bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 text-gray-800 dark:text-gray-200";
            });
            event.target.className = "filter-btn px-3 py-1.5 rounded-md bg-blue-600 text-white font-medium";
            filterOffenses();
        }

        // Фільтрація Загальної частини
        function filterGeneral() {
            const query = document.getElementById('generalSearch').value.toLowerCase();
            const filtered = generalData.filter(item => {
                return item.article.toLowerCase().includes(query) ||
                       item.title.toLowerCase().includes(query) ||
                       item.note.toLowerCase().includes(query);
            });
            renderGeneral(filtered);
        }

        // Перемикання вкладок
        function switchTab(tab) {
            if (tab === 'offenses') {
                document.getElementById('sectionOffenses').classList.remove('hidden');
                document.getElementById('sectionGeneral').classList.add('hidden');
                document.getElementById('tabOffensesBtn').className = "py-2.5 px-4 text-sm md:text-base font-medium flex items-center gap-2 tab-active transition";
                document.getElementById('tabGeneralBtn').className = "py-2.5 px-4 text-sm md:text-base font-medium flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 transition";
            } else {
                document.getElementById('sectionOffenses').classList.add('hidden');
                document.getElementById('sectionGeneral').classList.remove('hidden');
                document.getElementById('tabGeneralBtn').className = "py-2.5 px-4 text-sm md:text-base font-medium flex items-center gap-2 tab-active transition";
                document.getElementById('tabOffensesBtn').className = "py-2.5 px-4 text-sm md:text-base font-medium flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 transition";
            }
        }

        // Перемикач темної теми
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.className = 'fa-solid fa-sun text-lg';
            } else {
                themeIcon.className = 'fa-solid fa-moon text-lg';
            }
        });

        // Ініціалізація при старті
        renderOffenses(offensesData);
        renderGeneral(generalData);
    </script>
</body>
</html>
